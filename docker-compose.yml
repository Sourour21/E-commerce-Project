services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
    depends_on:
      - user-service
      - product-service
      - order-service
    restart: unless-stopped

  user-service:
    build: ./user-service
    environment:
      PORT: "3001"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: user_db
      DB_SSL: ${DB_SSL}
      TRUST_CLIENT_IP_HEADER: ${TRUST_CLIENT_IP_HEADER:-false}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  product-service:
    build: ./product-service
    environment:
      PORT: "3002"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: product_db
      DB_SSL: ${DB_SSL}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  order-service:
    build: ./order-service
    environment:
      PORT: "3003"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: order_db
      DB_SSL: ${DB_SSL}
      JWT_SECRET: ${JWT_SECRET}
      PRODUCT_SERVICE_URL: http://product-service:3002
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped
