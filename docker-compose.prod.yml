x-awslogs: &awslogs
  driver: awslogs
  options:
    awslogs-region: us-east-1
    awslogs-group: /ecommerce/app
    awslogs-create-group: "true"
    tag: "{{.Name}}"

services:
  api-gateway:
    logging: *awslogs

  user-service:
    logging: *awslogs

  product-service:
    logging: *awslogs

  order-service:
    logging: *awslogs

  frontend:
    logging: *awslogs
